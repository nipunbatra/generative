<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-label="Numerical discriminator and generator objectives" style="font-family:Avenir Next,Segoe UI,sans-serif"><rect x="90" y="60" width="400" height="95" rx="7" fill="#3478E50D" stroke="#3478E5" stroke-width="2"></rect><text x="290" y="115.5" text-anchor="middle" fill="#3478E5" font-size="37">D(x) = 0.9</text><rect x="625" y="60" width="400" height="95" rx="7" fill="#8B5BB50D" stroke="#8B5BB5" stroke-width="2"></rect><text x="825" y="115.5" text-anchor="middle" fill="#8B5BB5" font-size="37">D(G(z)) = 0.2</text><text x="560" y="246" text-anchor="middle" fill="#178F82" font-size="34">LD = −log 0.9 − log(1 − 0.2) = 0.329</text><text x="560" y="331" text-anchor="middle" fill="#8B5BB5" font-size="34">LG = −log 0.2 = 1.609</text><text x="560" y="420" text-anchor="middle" fill="#7C8490" font-size="23">Classical GAN source probability; a WGAN critic has a different interpretation.</text></svg>