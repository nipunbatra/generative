<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-label="Exact marginalization over three latent explanations; continuous latent variables require integration" style="font-family:Avenir Next,Segoe UI,sans-serif"><text x="40" y="45" text-anchor="start" fill="#7C8490" font-size="25">A tiny model with three latent choices</text><text x="470" y="100" text-anchor="middle" fill="#8B5BB5" font-size="30">z = A</text><text x="710" y="100" text-anchor="middle" fill="#8B5BB5" font-size="30">z = B</text><text x="950" y="100" text-anchor="middle" fill="#8B5BB5" font-size="30">z = C</text><text x="40" y="157" text-anchor="start" fill="#B98224" font-size="26">prior p(z)</text><text x="470" y="157" text-anchor="middle" fill="#B98224" font-size="29">0.20</text><text x="710" y="157" text-anchor="middle" fill="#B98224" font-size="29">0.50</text><text x="950" y="157" text-anchor="middle" fill="#B98224" font-size="29">0.30</text><text x="40" y="219" text-anchor="start" fill="#178F82" font-size="26">likelihood p(x | z)</text><text x="470" y="219" text-anchor="middle" fill="#178F82" font-size="29">0.10</text><text x="710" y="219" text-anchor="middle" fill="#178F82" font-size="29">0.80</text><text x="950" y="219" text-anchor="middle" fill="#178F82" font-size="29">0.20</text><path d="M40,248 H1060" fill="none" stroke="#D9DDE5" stroke-width="2"></path><text x="40" y="292" text-anchor="start" fill="#30343B" font-size="26">joint contribution</text><text x="470" y="292" text-anchor="middle" fill="#30343B" font-size="29">0.02</text><text x="710" y="292" text-anchor="middle" fill="#30343B" font-size="29">0.40</text><text x="950" y="292" text-anchor="middle" fill="#30343B" font-size="29">0.06</text><text x="560" y="357" text-anchor="middle" fill="#3478E5" font-size="31">p(x) = 0.02 + 0.40 + 0.06 = 0.48</text><text x="560" y="417" text-anchor="middle" fill="#8B5BB5" font-size="27">Continuous z: replace the sum with ∫ pθ(x | z) p(z) dz.</text></svg>