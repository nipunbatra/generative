<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-label="A fair source choice produces either a data observation or a generator sample; D predicts the hidden source" style="font-family:Avenir Next,Segoe UI,sans-serif"><text x="560" y="35" text-anchor="middle" fill="#30343B" font-size="30">Construct a balanced source-classification experiment</text><circle cx="140" cy="205" r="52" fill="#B98224" opacity="0.12"></circle><text x="140" y="217" text-anchor="middle" fill="#B98224" font-size="38">S</text><text x="140" y="306" text-anchor="middle" fill="#7C8490" font-size="24">choose source</text><path d="M182,169 L333,115" fill="none" stroke="#3478E5" stroke-width="3"></path><path d="M333,115 l-4,10 M333,115 l-16,10" fill="none" stroke="#3478E5" stroke-width="3"></path><text x="280" y="72" text-anchor="middle" fill="#3478E5" font-size="25">½: data</text><rect x="345" y="80" width="265" height="75" rx="7" fill="#3478E50D" stroke="#3478E5" stroke-width="2"></rect><text x="477.5" y="125.5" text-anchor="middle" fill="#3478E5" font-size="30">x ~ p<tspan baseline-shift="sub" font-size="0.72em">data</tspan></text><path d="M182,241 L333,278" fill="none" stroke="#8B5BB5" stroke-width="3"></path><path d="M333,278 l-4,-10 M333,278 l-16,-10" fill="none" stroke="#8B5BB5" stroke-width="3"></path><text x="280" y="340" text-anchor="middle" fill="#8B5BB5" font-size="25">½: generator</text><rect x="345" y="240" width="265" height="75" rx="7" fill="#8B5BB50D" stroke="#8B5BB5" stroke-width="2"></rect><text x="477.5" y="285.5" text-anchor="middle" fill="#8B5BB5" font-size="25">z ~ p(z), x = G(z)</text><path d="M620,117 L700,190" fill="none" stroke="#3478E5" stroke-width="3"></path><path d="M700,190 l-4,-10 M700,190 l-16,-10" fill="none" stroke="#3478E5" stroke-width="3"></path><path d="M620,277 L700,220" fill="none" stroke="#8B5BB5" stroke-width="3"></path><path d="M700,220 l-4,10 M700,220 l-16,10" fill="none" stroke="#8B5BB5" stroke-width="3"></path><rect x="710" y="167" width="100" height="76" rx="7" fill="#30343B0D" stroke="#30343B" stroke-width="2"></rect><text x="760" y="213" text-anchor="middle" fill="#30343B" font-size="32">x</text><text x="765" y="299" text-anchor="middle" fill="#7C8490" font-size="25">hide S</text><path d="M820,205 L905,205" fill="none" stroke="#30343B" stroke-width="3"></path><path d="M905,205 l-10,-6 M905,205 l-10,6" fill="none" stroke="#30343B" stroke-width="3"></path><rect x="915" y="167" width="170" height="76" rx="7" fill="#178F820D" stroke="#178F82" stroke-width="2"></rect><text x="1000" y="213" text-anchor="middle" fill="#178F82" font-size="33">D(x)</text><text x="1000" y="299" text-anchor="middle" fill="#178F82" font-size="26">P(S = 1 | x)</text><text x="560" y="415" text-anchor="middle" fill="#30343B" font-size="27">The generator induces p<tspan baseline-shift="sub" font-size="0.72em">G</tspan> over x through its map G(z).</text></svg>