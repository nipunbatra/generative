<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-label="Verified PyTorch sampling and reparameterized-sampling interfaces tied to the chain rule" style="font-family:Avenir Next,Segoe UI,sans-serif"><text x="40" y="38" text-anchor="start" fill="#30343B" font-size="29">Same distribution. Different autograd behavior.</text><text x="40" y="100" fill="#7C8490" font-size="28" font-family="Menlo,monospace">Normal(mu, std).sample()</text><text x="1080" y="100" text-anchor="end" fill="#7C8490" font-size="25">no pathwise autograd connection</text><path d="M40,130 H1080" fill="none" stroke="#D9DDE5" stroke-width="1"></path><text x="40" y="200" fill="#8B5BB5" font-size="28" font-family="Menlo,monospace">mu + std * eps</text><text x="1080" y="200" text-anchor="end" fill="#8B5BB5" font-size="25">explicit differentiable path</text><path d="M40,230 H1080" fill="none" stroke="#D9DDE5" stroke-width="1"></path><text x="40" y="300" fill="#178F82" font-size="28" font-family="Menlo,monospace">Normal(mu, std).rsample()</text><text x="1080" y="300" text-anchor="end" fill="#178F82" font-size="25">the reparameterized interface</text><path d="M40,330 H1080" fill="none" stroke="#D9DDE5" stroke-width="1"></path><text x="560" y="421" text-anchor="middle" fill="#30343B" font-size="24">For z = μ + σε:  ∂z/∂μ = 1,  ∂z/∂σ = ε. Keep ε fixed in this backward pass.</text></svg>