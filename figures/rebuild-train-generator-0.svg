" fill="#178F82" font-size="26">UPDATE θG</text><text x="875" y="143" text-anchor="middle" fill="#7C8490" font-size="26">HOLD θD</text><path d="M1077,244 L800,244 L752,244 L752,302 L428,302" fill="none" stroke="#D45555" stroke-width="3" stroke-dasharray="9 7"></path><path d="M475,302 L428,302" fill="none" stroke="#D45555" stroke-width="3" stroke-dasharray="9 7"></path><path d="M428,302 l10,-6 M428,302 l10,6" fill="none" stroke="#D45555" stroke-width="3"></path><text x="826" y="359" text-anchor="middle" fill="#D45555" font-size="24">Gradient through fixed D</text><text x="292" y="366" text-anchor="middle" fill="#178F82" font-size="22">θG ← θG − η∇θG LG</text><text x="560" y="414" text-anchor="middle" fill="#D45555" font-size="29">LG = −E log D(G(z))    (non-saturating)</text></svg>