<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-label="Discrete KL as expected extra log loss, with editable probabilities and a worked sum" style="font-family:Avenir Next,Segoe UI,sans-serif"><text x="280" y="35" text-anchor="middle" fill="#8B5BB5" font-size="27">Outcomes are drawn from q</text><text x="850" y="35" text-anchor="middle" fill="#B98224" font-size="27">Score them using p</text><rect x="185" y="151" width="65" height="104" fill="#8B5BB5"></rect><rect x="261" y="190" width="65" height="65" fill="#B98224"></rect><text x="217" y="287" text-anchor="middle" fill="#8B5BB5" font-size="21">q=0.80</text><text x="293" y="315" text-anchor="middle" fill="#B98224" font-size="21">p=0.50</text><text x="255" y="99" text-anchor="middle" fill="#30343B" font-size="28">A</text><rect x="455" y="229" width="65" height="25.999999999999993" fill="#8B5BB5"></rect><rect x="531" y="190" width="65" height="65" fill="#B98224"></rect><text x="487" y="287" text-anchor="middle" fill="#8B5BB5" font-size="21">q=0.20</text><text x="563" y="315" text-anchor="middle" fill="#B98224" font-size="21">p=0.50</text><text x="525" y="99" text-anchor="middle" fill="#30343B" font-size="28">B</text><text x="850" y="116" text-anchor="middle" fill="#7C8490" font-size="23">extra log loss at each outcome</text><text x="850" y="171" text-anchor="middle" fill="#30343B" font-size="26">A: log(q/p) = 0.470</text><text x="850" y="227" text-anchor="middle" fill="#30343B" font-size="26">B: log(q/p) = −0.916</text><text x="560" y="367" text-anchor="middle" fill="#30343B" font-size="28">0.80 × (0.470) + 0.20 × (−0.916)</text><text x="560" y="413" text-anchor="middle" fill="#178F82" font-size="32">KL(q ∥ p) = 0.193 nats</text></svg>