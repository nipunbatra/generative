<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 380" class="diagram" role="img" aria-label="reparam-numbers"><defs><marker id="reparam-numbers-ah-6B7280" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="reparam-numbers-ah-BE123C" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#BE123C"/></marker></defs><g data-b="1"><rect x="10" y="60" width="190" height="92" rx="12" fill="#FCEFD9" stroke="#AA4E08" stroke-width="2.2"/><foreignObject x="-275.0" y="80.0" width="760" height="70.4" overflow="visible"><div class="fo" style="font-size:32px;color:#AA4E08;font-weight:700;text-align:center;height:51.2px;line-height:51.2px">$-0.4$</div></foreignObject><foreignObject x="-275.0" y="18.5" width="760" height="48.4" overflow="visible"><div class="fo" style="font-size:22px;color:#AA4E08;font-weight:400;text-align:center;height:35.2px;line-height:35.2px">$\varepsilon$</div></foreignObject><path d="M202,106 L316,106" fill="none" stroke="#6B7280" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#reparam-numbers-ah-6B7280)"/><foreignObject x="160.0" y="67.8" width="200" height="46.2" overflow="visible"><div class="fo" style="font-size:21px;color:#4A5160;font-weight:650;text-align:center;height:33.6px;line-height:33.6px">$\times\,\sigma$ (0.5)</div></foreignObject><rect x="320" y="60" width="190" height="92" rx="12" fill="#F1E5FC" stroke="#8B2CDE" stroke-width="2.2"/><foreignObject x="35.0" y="80.0" width="760" height="70.4" overflow="visible"><div class="fo" style="font-size:32px;color:#8B2CDE;font-weight:700;text-align:center;height:51.2px;line-height:51.2px">$-0.2$</div></foreignObject><foreignObject x="35.0" y="18.5" width="760" height="48.4" overflow="visible"><div class="fo" style="font-size:22px;color:#8B2CDE;font-weight:400;text-align:center;height:35.2px;line-height:35.2px">$\sigma\varepsilon$</div></foreignObject><path d="M512,106 L626,106" fill="none" stroke="#6B7280" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#reparam-numbers-ah-6B7280)"/><foreignObject x="470.0" y="67.8" width="200" height="46.2" overflow="visible"><div class="fo" style="font-size:21px;color:#4A5160;font-weight:650;text-align:center;height:33.6px;line-height:33.6px">$+\,\mu$ (1)</div></foreignObject><rect x="630" y="60" width="190" height="92" rx="12" fill="#FCEFD9" stroke="#AA4E08" stroke-width="2.2"/><foreignObject x="345.0" y="80.0" width="760" height="70.4" overflow="visible"><div class="fo" style="font-size:32px;color:#AA4E08;font-weight:700;text-align:center;height:51.2px;line-height:51.2px">$0.8$</div></foreignObject><foreignObject x="345.0" y="18.5" width="760" height="48.4" overflow="visible"><div class="fo" style="font-size:22px;color:#AA4E08;font-weight:400;text-align:center;height:35.2px;line-height:35.2px">$z = \mu + \sigma\varepsilon$</div></foreignObject><path d="M822,106 L936,106" fill="none" stroke="#6B7280" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#reparam-numbers-ah-6B7280)"/><foreignObject x="780.0" y="67.8" width="200" height="46.2" overflow="visible"><div class="fo" style="font-size:21px;color:#4A5160;font-weight:650;text-align:center;height:33.6px;line-height:33.6px">square</div></foreignObject><rect x="940" y="60" width="190" height="92" rx="12" fill="#FDE2E7" stroke="#BE123C" stroke-width="2.2"/><foreignObject x="655.0" y="80.0" width="760" height="70.4" overflow="visible"><div class="fo" style="font-size:32px;color:#BE123C;font-weight:700;text-align:center;height:51.2px;line-height:51.2px">$0.64$</div></foreignObject><foreignObject x="655.0" y="18.5" width="760" height="48.4" overflow="visible"><div class="fo" style="font-size:22px;color:#BE123C;font-weight:400;text-align:center;height:35.2px;line-height:35.2px">$f = z^2$</div></foreignObject><foreignObject x="76.0" y="166.5" width="1000" height="48.4" overflow="visible"><div class="fo" style="font-size:22px;color:#6B7280;font-weight:500;text-align:center;height:35.2px;line-height:35.2px">forward: one fixed draw $\varepsilon=-0.4$, with $\mu = 1$ and $\sigma = 0.5$</div></foreignObject></g><g data-b="2"><path d="M990,270 L842,270" fill="none" stroke="#BE123C" stroke-width="2.8" stroke-linejoin="round" marker-end="url(#reparam-numbers-ah-BE123C)"/><foreignObject x="1000.0" y="227.0" width="760" height="44.0" overflow="visible"><div class="fo" style="font-size:20px;color:#BE123C;font-weight:400;text-align:left;height:32.0px;line-height:32.0px">$\frac{\partial f}{\partial z} = 2z = 1.6$</div></foreignObject><rect x="560" y="238" width="280" height="64" rx="12" fill="#FDE2E7" stroke="#BE123C" stroke-width="2.2"/><foreignObject x="320.0" y="253.8" width="760" height="46.2" overflow="visible"><div class="fo" style="font-size:21px;color:#BE123C;font-weight:400;text-align:center;height:33.6px;line-height:33.6px">$\frac{\partial f}{\partial\mu} = 1.6\times 1 = 1.6$</div></foreignObject></g><g data-b="3"><rect x="200" y="238" width="340" height="64" rx="12" fill="#FDE2E7" stroke="#BE123C" stroke-width="2.2"/><foreignObject x="-10.0" y="253.8" width="760" height="46.2" overflow="visible"><div class="fo" style="font-size:21px;color:#BE123C;font-weight:400;text-align:center;height:33.6px;line-height:33.6px">$\frac{\partial f}{\partial\sigma} = 1.6\times\varepsilon = -0.64$</div></foreignObject><foreignObject x="-10.0" y="313.8" width="760" height="46.2" overflow="visible"><div class="fo" style="font-size:21px;color:#BE123C;font-weight:650;text-align:center;height:33.6px;line-height:33.6px">the noise value multiplies the $\sigma$-gradient</div></foreignObject></g></svg>