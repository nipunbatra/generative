;color:#AA4E08;font-weight:400;text-align:center;height:48.0px;line-height:48.0px">$\varepsilon$</div></foreignObject><foreignObject x="140.0" y="153.0" width="760" height="44.0" overflow="visible"><div class="fo" style="font-size:20px;color:#AA4E08;font-weight:400;text-align:center;height:32.0px;line-height:32.0px">$\varepsilon = (0.62,\, -1.15)$</div></foreignObject><text x="520" y="210" font-family="'Avenir Next', 'Avenir', 'Segoe UI', sans-serif" font-size="20" font-weight="500" fill="#6B7280" text-anchor="middle">drawn from a standard normal once</text></g><g data-b="3"><foreignObject x="600.0" y="68.5" width="520" height="48.4" overflow="visible"><div class="fo" style="font-size:22px;color:#14171F;font-weight:400;text-align:center;height:35.2px;line-height:35.2px">$z_1 = \mu_1 + \sigma_1\varepsilon_1$</div></foreignObject><foreignObject x="600.0" y="108.5" width="520" height="48.4" overflow="visible"><div class="fo" style="font-size:22px;color:#14171F;font-weight:400;text-align:center;height:35.2px;line-height:35.2px">$= 0.30 + 0.047 \times 0.62 = 0.33$</div></foreignObject></g><g data-b="4"><foreignObject x="600.0" y="178.5" width="520" height="48.4" overflow="visible"><div class="fo" style="font-size:22px;color:#14171F;font-weight:400;text-align:center;height:35.2px;line-height:35.2px">$z_2 = \mu_2 + \sigma_2\varepsilon_2$</div></foreignObject><foreignObject x="600.0" y="218.5" width="520" height="48.4" overflow="visible"><div class="fo" style="font-size:22px;color:#14171F;font-weight:400;text-align:center;height:35.2px;line-height:35.2px">$= -1.93 + 0.050 \times (-1.15) = -1.99$</div></foreignObject></g><g data-b="5"><circle cx="247.16" cy="323.48" r="7" fill="#AA4E08" stroke="#fff" stroke-width="1.5"/><rect x="760" y="300" width="100" height="46" fill="#FCEFD9" stroke="#AA4E08" stroke-width="2"/><text x="810.0" y="329.0" font-family="SF Mono, Menlo, monospace" font-size="17" fill="#14171F" text-anchor="middle">0.33</text><rect x="860" y="300" width="100" height="46" fill="#FCEFD9" stroke="#AA4E08" stroke-width="2"/><text x="910.0" y="329.0" font-family="SF Mono, Menlo, monospace" font-size="17" fill="#14171F" text-anchor="middle">−1.99</text><foreignObject x="-60.0" y="300.0" width="760" height="52.8" overflow="visible"><div class="fo" style="font-size:24px;color:#AA4E08;font-weight:400;text-align:right;height:38.4px;line-height:38.4px">$z =$</div></foreignObject><text x="860" y="380" font-family="'Avenir Next', 'Avenir', 'Segoe UI', sans-serif" font-size="22" font-weight="650" fill="#AA4E08" text-anchor="middle">one code from inside the cloud</text></g></svg>