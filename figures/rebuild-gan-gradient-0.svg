<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-label="Generator loss derivatives with respect to the discriminator logit, comparing minimax and non-saturating objectives" style="font-family:Avenir Next,Segoe UI,sans-serif"><text x="560" y="35" text-anchor="middle" fill="#30343B" font-size="28">Hold D’s weights fixed; keep its input-gradient path.</text><rect x="55" y="105" width="150" height="75" rx="7" fill="#8B5BB50D" stroke="#8B5BB5" stroke-width="2"></rect><text x="130" y="150.5" text-anchor="middle" fill="#8B5BB5" font-size="30">G(z)</text><path d="M215,142 L300,142" fill="none" stroke="#8B5BB5" stroke-width="3"></path><path d="M300,142 l-10,-6 M300,142 l-10,6" fill="none" stroke="#8B5BB5" stroke-width="3"></path><rect x="310" y="105" width="150" height="75" rx="7" fill="#8B5BB50D" stroke="#8B5BB5" stroke-width="2"></rect><text x="385" y="150.5" text-anchor="middle" fill="#8B5BB5" font-size="30">x</text><path d="M470,142 L555,142" fill="none" stroke="#8B5BB5" stroke-width="3"></path><path d="M555,142 l-10,-6 M555,142 l-10,6" fill="none" stroke="#8B5BB5" stroke-width="3"></path><rect x="565" y="105" width="205" height="75" rx="7" fill="#7C84900D" stroke="#7C8490" stroke-width="2"></rect><text x="667.5" y="150.5" text-anchor="middle" fill="#7C8490" font-size="25">logit a = −4.00</text><path d="M780,142 L860,142" fill="none" stroke="#7C8490" stroke-width="3"></path><path d="M860,142 l-10,-6 M860,142 l-10,6" fill="none" stroke="#7C8490" stroke-width="3"></path><rect x="870" y="105" width="225" height="75" rx="7" fill="#178F820D" stroke="#178F82" stroke-width="2"></rect><text x="982.5" y="150.5" text-anchor="middle" fill="#178F82" font-size="29">D = 0.018</text><text x="570" y="222" text-anchor="middle" fill="#178F82" font-size="25">D = sigmoid(a)</text><text x="55" y="295" text-anchor="start" fill="#7C8490" font-size="27">minimax: log(1 − D)</text><text x="600" y="295" text-anchor="middle" fill="#7C8490" font-size="25">−D</text><path d="M935,286 H930.5034475094772" fill="none" stroke="#7C8490" stroke-width="12"></path><text x="1080" y="295" text-anchor="end" fill="#7C8490" font-size="30">−0.018</text><text x="55" y="365" text-anchor="start" fill="#178F82" font-size="27">non-saturating: −log D</text><text x="600" y="365" text-anchor="middle" fill="#178F82" font-size="25">D − 1</text><path d="M935,356 H689.4965524905228" fill="none" stroke="#178F82" stroke-width="12"></path><text x="1080" y="365" text-anchor="end" fill="#178F82" font-size="30">−0.982</text><text x="560" y="430" text-anchor="middle" fill="#30343B" font-size="25">These are ∂L/∂a. The full gradient also passes through D and G.</text><text x="865" y="245" text-anchor="middle" fill="#7C8490" font-size="22">∂L / ∂a</text></svg>