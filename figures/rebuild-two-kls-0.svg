<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-label="Posterior KL is the gap; prior KL is part of the computable ELBO" style="font-family:Avenir Next,Segoe UI,sans-serif"><text x="40" y="45" text-anchor="start" fill="#7C8490" font-size="27">The gap: a comparison we cannot usually compute</text><text x="560" y="115" text-anchor="middle" fill="#8B5BB5" font-size="32">log pθ(x) − ELBO = KL(qφ(z | x) ∥ pθ(z | x))</text><text x="920" y="163" text-anchor="middle" fill="#3478E5" font-size="24">true posterior</text><path d="M40,214 H1080" fill="none" stroke="#D9DDE5" stroke-width="2"></path><text x="40" y="261" text-anchor="start" fill="#7C8490" font-size="27">The objective: terms we can estimate or compute</text><text x="560" y="331" text-anchor="middle" fill="#30343B" font-size="31">ELBO = E q [log pθ(x | z)] − KL(qφ(z | x) ∥ p(z))</text><text x="385" y="386" text-anchor="middle" fill="#178F82" font-size="24">reconstruction likelihood</text><text x="993" y="386" text-anchor="middle" fill="#B98224" font-size="24">prior</text></svg>