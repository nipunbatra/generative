<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-label="Binary classification log likelihood averaged over the two sources yields the discriminator objective" style="font-family:Avenir Next,Segoe UI,sans-serif"><text x="560" y="48" text-anchor="middle" fill="#30343B" font-size="30">A Bernoulli model for the hidden source S</text><rect x="70" y="105" width="440" height="80" rx="7" fill="#3478E50D" stroke="#3478E5" stroke-width="2"></rect><text x="290" y="153" text-anchor="middle" fill="#3478E5" font-size="29">S = 1: probability D(x)</text><rect x="610" y="105" width="440" height="80" rx="7" fill="#8B5BB50D" stroke="#8B5BB5" stroke-width="2"></rect><text x="830" y="153" text-anchor="middle" fill="#8B5BB5" font-size="27">S = 0: probability 1 − D(x)</text><text x="560" y="258" text-anchor="middle" fill="#30343B" font-size="29">log P(S | x) = S log D(x) + (1 − S) log(1 − D(x))</text><text x="560" y="335" text-anchor="middle" fill="#178F82" font-size="29">V(G,D) = E<tspan baseline-shift="sub" font-size="0.72em">data</tspan>[log D(x)] + E<tspan baseline-shift="sub" font-size="0.72em">G</tspan>[log(1 − D(x))]</text><text x="560" y="405" text-anchor="middle" fill="#30343B" font-size="26">Balanced average = V / 2. Train D by minimising L<tspan baseline-shift="sub" font-size="0.72em">D</tspan> = −V.</text></svg>