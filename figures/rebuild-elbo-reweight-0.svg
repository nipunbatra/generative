<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-label="Reweight three joint probabilities under a sampleable approximate posterior without changing the evidence" style="font-family:Avenir Next,Segoe UI,sans-serif"><text x="40" y="35" text-anchor="start" fill="#7C8490" font-size="27">Same fixed model. Choose q = (0.4, 0.3, 0.3).</text><text x="450" y="95" text-anchor="middle" fill="#8B5BB5" font-size="30">A</text><text x="700" y="95" text-anchor="middle" fill="#8B5BB5" font-size="30">B</text><text x="950" y="95" text-anchor="middle" fill="#8B5BB5" font-size="30">C</text><text x="40" y="150" text-anchor="start" fill="#3478E5" font-size="26">joint p(x,z)</text><text x="450" y="150" text-anchor="middle" fill="#3478E5" font-size="29">0.02</text><text x="700" y="150" text-anchor="middle" fill="#3478E5" font-size="29">0.40</text><text x="950" y="150" text-anchor="middle" fill="#3478E5" font-size="29">0.06</text><text x="40" y="212" text-anchor="start" fill="#8B5BB5" font-size="26">proposal q(z | x)</text><text x="450" y="212" text-anchor="middle" fill="#8B5BB5" font-size="29">0.40</text><text x="700" y="212" text-anchor="middle" fill="#8B5BB5" font-size="29">0.30</text><text x="950" y="212" text-anchor="middle" fill="#8B5BB5" font-size="29">0.30</text><path d="M40,241 H1070" fill="none" stroke="#D9DDE5" stroke-width="2"></path><text x="40" y="286" text-anchor="start" fill="#30343B" font-size="25">weight w = joint / q</text><text x="450" y="286" text-anchor="middle" fill="#30343B" font-size="29">0.050</text><text x="700" y="286" text-anchor="middle" fill="#30343B" font-size="29">1.333</text><text x="950" y="286" text-anchor="middle" fill="#30343B" font-size="29">0.200</text><text x="560" y="357" text-anchor="middle" fill="#30343B" font-size="27">E<tspan baseline-shift="sub" font-size="0.72em">q</tspan>[w] = 0.4 × 0.05 + 0.3 × 1.333… + 0.3 × 0.2</text><text x="560" y="410" text-anchor="middle" fill="#178F82" font-size="33">E<tspan baseline-shift="sub" font-size="0.72em">q</tspan>[w] = 0.48 = p(x)</text></svg>