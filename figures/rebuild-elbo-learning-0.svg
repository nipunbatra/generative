<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-label="Sample latent explanations from the encoder, score the observed image with the decoder, and subtract prior KL" style="font-family:Avenir Next,Segoe UI,sans-serif"><text x="560" y="35" text-anchor="middle" fill="#30343B" font-size="30">A computable objective for each observed x</text><rect x="30" y="107" width="130" height="76" rx="7" fill="#3478E50D" stroke="#3478E5" stroke-width="2"></rect><text x="95" y="153" text-anchor="middle" fill="#3478E5" font-size="33">x</text><path d="M170,145 L245,145" fill="none" stroke="#3478E5" stroke-width="3"></path><path d="M245,145 l-10,-6 M245,145 l-10,6" fill="none" stroke="#3478E5" stroke-width="3"></path><rect x="255" y="107" width="250" height="76" rx="7" fill="#8B5BB50D" stroke="#8B5BB5" stroke-width="2"></rect><text x="380" y="153" text-anchor="middle" fill="#8B5BB5" font-size="31">qφ(z | x)</text><path d="M515,145 L580,145" fill="none" stroke="#8B5BB5" stroke-width="3"></path><path d="M580,145 l-10,-6 M580,145 l-10,6" fill="none" stroke="#8B5BB5" stroke-width="3"></path><rect x="590" y="107" width="150" height="76" rx="7" fill="#8B5BB50D" stroke="#8B5BB5" stroke-width="2"></rect><text x="665" y="153" text-anchor="middle" fill="#8B5BB5" font-size="27">z₁, …, z<tspan baseline-shift="sub" font-size="0.72em">K</tspan></text><path d="M750,145 L815,145" fill="none" stroke="#8B5BB5" stroke-width="3"></path><path d="M815,145 l-10,-6 M815,145 l-10,6" fill="none" stroke="#8B5BB5" stroke-width="3"></path><rect x="825" y="107" width="265" height="76" rx="7" fill="#178F820D" stroke="#178F82" stroke-width="2"></rect><text x="957.5" y="153" text-anchor="middle" fill="#178F82" font-size="28">log pθ(x | z)</text><text x="380" y="225" text-anchor="middle" fill="#8B5BB5" font-size="23">encoder proposes</text><text x="665" y="225" text-anchor="middle" fill="#8B5BB5" font-size="23">K draws</text><text x="958" y="225" text-anchor="middle" fill="#178F82" font-size="23">decoder scores x</text><text x="560" y="310" text-anchor="middle" fill="#30343B" font-size="28">ELBO estimate = average log likelihood − KL(qφ(z | x) ∥ p(z))</text><text x="560" y="378" text-anchor="middle" fill="#178F82" font-size="27">Minimise the negative bound over examples; update both φ and θ.</text><text x="560" y="423" text-anchor="middle" fill="#7C8490" font-size="23">Gaussian prior KL is exact here. The expectation uses samples.</text></svg>