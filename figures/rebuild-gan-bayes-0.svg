<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-label="Exact Bayes discriminator for three categorical outcomes with adjustable source prior" style="font-family:Avenir Next,Segoe UI,sans-serif"><text x="560" y="35" text-anchor="middle" fill="#7C8490" font-size="26">Data-source prior π = 0.50; generator-source prior = 0.50</text><text x="450" y="94" text-anchor="middle" fill="#30343B" font-size="28">A</text><text x="700" y="94" text-anchor="middle" fill="#30343B" font-size="28">B</text><text x="950" y="94" text-anchor="middle" fill="#30343B" font-size="28">C</text><text x="45" y="150" text-anchor="start" fill="#3478E5" font-size="28">p<tspan baseline-shift="sub" font-size="0.72em">data</tspan>(x)</text><text x="450" y="150" text-anchor="middle" fill="#3478E5" font-size="28">0.60</text><text x="700" y="150" text-anchor="middle" fill="#3478E5" font-size="28">0.30</text><text x="950" y="150" text-anchor="middle" fill="#3478E5" font-size="28">0.10</text><text x="45" y="210" text-anchor="start" fill="#8B5BB5" font-size="28">p<tspan baseline-shift="sub" font-size="0.72em">G</tspan>(x)</text><text x="450" y="210" text-anchor="middle" fill="#8B5BB5" font-size="28">0.10</text><text x="700" y="210" text-anchor="middle" fill="#8B5BB5" font-size="28">0.30</text><text x="950" y="210" text-anchor="middle" fill="#8B5BB5" font-size="28">0.60</text><path d="M45,240 H1075" fill="none" stroke="#D9DDE5" stroke-width="2"></path><text x="45" y="287" text-anchor="start" fill="#178F82" font-size="30">D*(x)</text><text x="450" y="287" text-anchor="middle" fill="#178F82" font-size="33">0.857</text><text x="700" y="287" text-anchor="middle" fill="#178F82" font-size="33">0.500</text><text x="950" y="287" text-anchor="middle" fill="#178F82" font-size="33">0.143</text><text x="560" y="357" text-anchor="middle" fill="#30343B" font-size="27">D*(x) = π p<tspan baseline-shift="sub" font-size="0.72em">data</tspan>(x) / [π p<tspan baseline-shift="sub" font-size="0.72em">data</tspan>(x) + (1 − π) p<tspan baseline-shift="sub" font-size="0.72em">G</tspan>(x)]</text><text x="560" y="418" text-anchor="middle" fill="#178F82" font-size="25">Equal priors: D* / (1 − D*) = p<tspan baseline-shift="sub" font-size="0.72em">data</tspan> / p<tspan baseline-shift="sub" font-size="0.72em">G</tspan></text></svg>