<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-label="KL asymmetry demonstrated by reversing the averaging distribution" style="font-family:Avenir Next,Segoe UI,sans-serif"><text x="560" y="50" text-anchor="middle" fill="#30343B" font-size="31">q = (0.8, 0.2)        p = (0.5, 0.5)</text><text x="270" y="140" text-anchor="middle" fill="#8B5BB5" font-size="30">Draw from q</text><text x="270" y="210" text-anchor="middle" fill="#30343B" font-size="27">0.8 log(0.8/0.5)</text><text x="270" y="253" text-anchor="middle" fill="#30343B" font-size="27">+ 0.2 log(0.2/0.5)</text><text x="270" y="320" text-anchor="middle" fill="#8B5BB5" font-size="39">0.193 nats</text><path d="M560,105 V340" fill="none" stroke="#D9DDE5" stroke-width="2"></path><text x="850" y="140" text-anchor="middle" fill="#B98224" font-size="30">Draw from p</text><text x="850" y="210" text-anchor="middle" fill="#30343B" font-size="27">0.5 log(0.5/0.8)</text><text x="850" y="253" text-anchor="middle" fill="#30343B" font-size="27">+ 0.5 log(0.5/0.2)</text><text x="850" y="320" text-anchor="middle" fill="#B98224" font-size="39">0.223 nats</text><text x="560" y="415" text-anchor="middle" fill="#30343B" font-size="25">The first distribution determines the averaging weights. KL is not symmetric.</text></svg>